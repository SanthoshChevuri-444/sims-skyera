<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKYERA</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: rgba(10, 16, 30, 0.88);
        --line: rgba(170, 190, 230, 0.22);
        --text: #e8eefc;
        --muted: #9aabc8;
        --ok: #6ddea5;
        --idle: #d6b35c;
      }

      html,
      body,
      #app {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Mono", "SF Mono", "Menlo", monospace;
      }

      #boot-panel {
        position: absolute;
        z-index: 2;
        top: 24px;
        left: 24px;
        width: min(420px, calc(100% - 48px));
        padding: 20px 22px;
        background: var(--panel);
        border: 1px solid var(--line);
        backdrop-filter: blur(8px);
      }

      #boot-panel h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.18em;
        font-weight: 600;
      }

      #boot-panel .subtitle {
        margin: 6px 0 18px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.12em;
      }

      #boot-panel h2 {
        margin: 0 0 12px;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--muted);
        font-weight: 500;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 6px 0;
        font-size: 12px;
        border-top: 1px solid rgba(170, 190, 230, 0.1);
      }

      .status-row:first-of-type {
        border-top: none;
      }

      .status-ok {
        color: var(--ok);
      }

      .status-idle {
        color: var(--idle);
      }

      .note {
        margin-top: 16px;
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <aside id="boot-panel" aria-label="SKYERA system status">
      <h1>SKYERA</h1>
      <p class="subtitle">DISASTER RESPONSE SIMULATION</p>
      <h2>SYSTEM STATUS</h2>
      <div class="status-row">
        <span>Desktop Shell</span>
        <span class="status-ok" id="status-shell">ONLINE</span>
      </div>
      <div class="status-row">
        <span>Simulation Core</span>
        <span class="status-ok" id="status-core">READY</span>
      </div>
      <div class="status-row">
        <span>Three.js Renderer</span>
        <span class="status-idle" id="status-renderer">INITIALIZING</span>
      </div>
      <div class="status-row">
        <span>Local Simulation Adapter</span>
        <span class="status-ok" id="status-adapter">READY</span>
      </div>
      <div class="status-row">
        <span>Mission Systems</span>
        <span class="status-idle">NOT INITIALIZED</span>
      </div>
      <p class="note">Phase 1A boot verification — mission implementation not started.</p>
    </aside>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
